# Hot-reload development environment: docker compose -f docker-compose.dev.yml up
services:
  dev:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host"
    ports:
      - '5173:5173'
      - '3000:3000'
    volumes:
      - .:/app
      - /app/node_modules
